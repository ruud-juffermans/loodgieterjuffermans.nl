# nginx config for the Docker image (see Dockerfile). TLS is terminated by the
# reverse proxy in front of the container (Traefik on Dokploy), so this only
# listens on port 80 and trusts the Host header it receives.
server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # Bare domain -> www (the proxy already upgraded to https)
    if ($host = "loodgieterjuffermans.nl") {
        return 301 https://www.loodgieterjuffermans.nl$request_uri;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml text/xml application/xml;
    gzip_min_length 1024;

    # Hashed build assets never change
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # /diensten/zinkwerk -> diensten/zinkwerk.html; unknown paths are a real 404
    location / {
        try_files $uri $uri.html $uri/index.html =404;
        add_header Cache-Control "public, max-age=600";
    }

    error_page 404 /404.html;
}
